[workspace]
members = ["atlas-api", "atlas-cli"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.0", features = ["cargo", "derive"] }
eyre = "0.6"
directories = "6"
itertools = "0.14"
lazy-regex = "3.1"
log = { version = "0.4", features = ["std", "serde"] }
regex = "1.7"
reqwest = { version = "0.12", features = ["socks", "blocking", "gzip", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stderrlog = "0.6"
toml = "0.9"
rstest = "0.26"
